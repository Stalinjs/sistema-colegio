{% extends "plantilla.html" %}
{% block contenido %}

<div class="page-inner">

  <div class="page-header">
    <h4 class="page-title">Editar Estudiante</h4>
    <ul class="breadcrumbs">
      <li class="nav-home">
        <a href="{% url 'dashboard_secretaria' %}"><i class="fa fa-home"></i></a>
      </li>
      <li class="separator"><i class="fa fa-angle-right"></i></li>
      <li class="nav-item">
        <a href="{% url 'estudiantes_lista' %}">Estudiantes</a>
      </li>
      <li class="separator"><i class="fa fa-angle-right"></i></li>
      <li class="nav-item">Editar</li>
    </ul>
  </div>

  <div class="card">
    <div class="card-header">
      <h5 class="card-title mb-0">Actualizar datos</h5>
      <small class="text-muted">Los campos con * son obligatorios.</small>
    </div>

    <div class="card-body">
      <form method="post" id="frm_estudiante">
        {% csrf_token %}

        <div class="row">

          <div class="col-md-4 mb-3">
            <label class="form-label">Tipo de documento *</label>
            <select name="tipo_documento" class="form-select">
              <option value="CEDULA" {% if estudiante.tipo_documento == "CEDULA" %}selected{% endif %}>Cédula</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Cédula *</label>
            <input type="text" name="cedula" class="form-control" maxlength="10" value="{{ estudiante.cedula }}" readonly>
            <small class="text-muted">La cédula no se puede modificar.</small>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Sexo *</label>
            <select name="sexo" class="form-select">
              <option value="">Seleccione...</option>
              <option value="HOMBRE" {% if estudiante.sexo == "HOMBRE" %}selected{% endif %}>Hombre</option>
              <option value="MUJER" {% if estudiante.sexo == "MUJER" %}selected{% endif %}>Mujer</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Nombres *</label>
            <input type="text" name="nombres" class="form-control" value="{{ estudiante.nombres }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Apellido paterno *</label>
            <input type="text" name="apellido_paterno" class="form-control" value="{{ estudiante.apellido_paterno }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Apellido materno *</label>
            <input type="text" name="apellido_materno" class="form-control" value="{{ estudiante.apellido_materno }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Fecha de nacimiento *</label>
            <input type="date" name="fecha_nacimiento" class="form-control"
                   value="{% if estudiante.fecha_nacimiento %}{{ estudiante.fecha_nacimiento|date:'Y-m-d' }}{% endif %}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Nacionalidad *</label>
            <input type="text" name="nacionalidad" class="form-control" value="{{ estudiante.nacionalidad|default:'' }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Etnia *</label>
            <select name="etnia" id="etnia" class="form-select">
              <option value="">Seleccione...</option>
              <option value="INDIGENA" {% if estudiante.etnia == "INDIGENA" %}selected{% endif %}>Indígena</option>
              <option value="MESTIZA" {% if estudiante.etnia == "MESTIZA" %}selected{% endif %}>Mestiza</option>
              <option value="NEGRA" {% if estudiante.etnia == "NEGRA" %}selected{% endif %}>Negra</option>
              <option value="BLANCA" {% if estudiante.etnia == "BLANCA" %}selected{% endif %}>Blanca</option>
              <option value="MONTUBIA" {% if estudiante.etnia == "MONTUBIA" %}selected{% endif %}>Montubia</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Nacionalidad indígena</label>
            <select name="nacionalidad_indigena" id="nacionalidad_indigena" class="form-select">
              <option value="">Seleccione...</option>
              <option value="ACHUAR" {% if estudiante.nacionalidad_indigena == "ACHUAR" %}selected{% endif %}>Achuar</option>
              <option value="AI_KOFAN" {% if estudiante.nacionalidad_indigena == "AI_KOFAN" %}selected{% endif %}>Ai Kofan</option>
              <option value="AWA_KWAIKER" {% if estudiante.nacionalidad_indigena == "AWA_KWAIKER" %}selected{% endif %}>Awá-Kwaiker</option>
              <option value="CHACHI" {% if estudiante.nacionalidad_indigena == "CHACHI" %}selected{% endif %}>Chachi</option>
              <option value="EPERA" {% if estudiante.nacionalidad_indigena == "EPERA" %}selected{% endif %}>Épera</option>
              <option value="KICHWA" {% if estudiante.nacionalidad_indigena == "KICHWA" %}selected{% endif %}>Kichwa</option>
              <option value="SECOYA" {% if estudiante.nacionalidad_indigena == "SECOYA" %}selected{% endif %}>Secoya</option>
              <option value="SHIWIAR" {% if estudiante.nacionalidad_indigena == "SHIWIAR" %}selected{% endif %}>Shiwiar</option>
              <option value="SHUAR" {% if estudiante.nacionalidad_indigena == "SHUAR" %}selected{% endif %}>Shuar</option>
              <option value="SIONA" {% if estudiante.nacionalidad_indigena == "SIONA" %}selected{% endif %}>Siona</option>
              <option value="TSACHILA" {% if estudiante.nacionalidad_indigena == "TSACHILA" %}selected{% endif %}>Tsáchila</option>
              <option value="WAORANI" {% if estudiante.nacionalidad_indigena == "WAORANI" %}selected{% endif %}>Waorani</option>
              <option value="ZAPARA" {% if estudiante.nacionalidad_indigena == "ZAPARA" %}selected{% endif %}>Zápara</option>
              <option value="OTRA_NACIONALIDAD" {% if estudiante.nacionalidad_indigena == "OTRA_NACIONALIDAD" %}selected{% endif %}>Otra Nacionalidad</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">LGBTI</label>
            <select name="lgbti" class="form-select">
              <option value="">Seleccione...</option>
              <option value="SI" {% if estudiante.lgbti == "SI" %}selected{% endif %}>Sí</option>
              <option value="NO" {% if estudiante.lgbti == "NO" %}selected{% endif %}>No</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Extensión *</label>
            <select name="sucursal" class="form-select">
              <option value="" disabled>Seleccione...</option>
              {% for s in sucursales %}
                <option value="{{ s.id }}" {% if estudiante.sucursal and s.id == estudiante.sucursal.id %}selected{% endif %}>
                  {{ s.nombre }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Provincia *</label>
            <input type="text" name="provincia" class="form-control" value="{{ estudiante.provincia|default:'' }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Cantón *</label>
            <input type="text" name="canton" class="form-control" value="{{ estudiante.canton|default:'' }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Parroquia *</label>
            <input type="text" name="parroquia" class="form-control" value="{{ estudiante.parroquia|default:'' }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ estudiante.telefono|default:'' }}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Dirección *</label>
            <textarea name="direccion" class="form-control" rows="2">{{ estudiante.direccion|default:'' }}</textarea>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Posee discapacidad validada *</label>
            <select name="posee_discapacidad" id="posee_discapacidad" class="form-select">
              <option value="">Seleccione...</option>
              <option value="SI" {% if estudiante.posee_discapacidad == "SI" %}selected{% endif %}>Sí</option>
              <option value="NO" {% if estudiante.posee_discapacidad == "NO" %}selected{% endif %}>No</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Tipo de discapacidad</label>
            <select name="tipo_discapacidad" id="tipo_discapacidad" class="form-select">
              <option value="">Seleccione...</option>
              <option value="FISICA" {% if estudiante.tipo_discapacidad == "FISICA" %}selected{% endif %}>Física</option>
              <option value="INTELECTUAL" {% if estudiante.tipo_discapacidad == "INTELECTUAL" %}selected{% endif %}>Intelectual</option>
              <option value="AUDITIVA" {% if estudiante.tipo_discapacidad == "AUDITIVA" %}selected{% endif %}>Auditiva</option>
              <option value="VISUAL" {% if estudiante.tipo_discapacidad == "VISUAL" %}selected{% endif %}>Visual</option>
              <option value="PSICOSOCIAL" {% if estudiante.tipo_discapacidad == "PSICOSOCIAL" %}selected{% endif %}>Psicosocial</option>
              <option value="LENGUAJE" {% if estudiante.tipo_discapacidad == "LENGUAJE" %}selected{% endif %}>Lenguaje</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Porcentaje de discapacidad</label>
            <input
              type="number"
              name="porcentaje_discapacidad"
              id="porcentaje_discapacidad"
              class="form-control"
              min="0"
              max="100"
              step="1"
              value="{{ estudiante.porcentaje_discapacidad|default:'' }}"
            >
          </div>

          <div class="col-md-12 mt-3">
            <hr>
            <h5 class="mb-3">Antecedente académico de ingreso</h5>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Último curso aprobado</label>
            <select name="curso_aprobado_ingreso" class="form-select">
              <option value="">Seleccione...</option>
              {% for c in cursos %}
                <option value="{{ c.id }}"
                  {% if historial_ingreso and historial_ingreso.curso_aprobado.id == c.id %}selected{% endif %}>
                  {{ c.nombre }} - Orden {{ c.orden }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Institución de procedencia</label>
            <input type="text" name="institucion_procedencia" class="form-control"
                   value="{% if historial_ingreso %}{{ historial_ingreso.institucion_procedencia|default:'' }}{% endif %}">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label">Observación de ingreso</label>
            <input type="text" name="observacion_ingreso" class="form-control"
                   value="{% if historial_ingreso %}{{ historial_ingreso.observacion|default:'' }}{% endif %}">
          </div>

        </div>

        <div class="text-end mt-3">
          <a href="{% url 'estudiantes_lista' %}" class="btn btn-outline-secondary">
            Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fa fa-save"></i> Guardar cambios
          </button>
        </div>

      </form>
    </div>
  </div>

</div>

{% block scripts %}
<script>
function toggleDiscapacidadFields() {
    const posee = $("#posee_discapacidad").val();
    const tipo = $("#tipo_discapacidad");
    const porcentaje = $("#porcentaje_discapacidad");

    if (posee === "SI") {
        tipo.prop("disabled", false);
        porcentaje.prop("readonly", false);
    } else {
        tipo.val("").prop("disabled", true);
        porcentaje.val("").prop("readonly", true).val("");
    }
}

function toggleNacionalidadIndigena() {
    const etnia = $("#etnia").val();
    const nacionalidad = $("#nacionalidad_indigena");

    if (etnia === "INDIGENA") {
        nacionalidad.prop("disabled", false);
    } else {
        nacionalidad.val("").prop("disabled", true);
    }
}

$(document).ready(function () {
    toggleDiscapacidadFields();
    toggleNacionalidadIndigena();

    $("#posee_discapacidad").on("change", function () {
        toggleDiscapacidadFields();
    });

    $("#etnia").on("change", function () {
        toggleNacionalidadIndigena();
    });

    $("#frm_estudiante").validate({
        rules: {
            tipo_documento: { required: true },
            sexo: { required: true },
            nombres: { required: true, minlength: 2 },
            apellido_paterno: { required: true, minlength: 2 },
            apellido_materno: { required: true, minlength: 2 },
            fecha_nacimiento: { required: true },
            nacionalidad: { required: true, minlength: 3 },
            etnia: { required: true },
            nacionalidad_indigena: {
                required: function() {
                    return $("#etnia").val() === "INDIGENA";
                }
            },
            posee_discapacidad: { required: true },
            sucursal: { required: true },
            provincia: { required: true, minlength: 2 },
            canton: { required: true, minlength: 2 },
            parroquia: { required: true, minlength: 2 },
            direccion: { required: true, minlength: 5 },
            porcentaje_discapacidad: {
                required: function() {
                    return $("#posee_discapacidad").val() === "SI";
                },
                digits: true,
                min: 0,
                max: 100
            },
            tipo_discapacidad: {
                required: function() {
                    return $("#posee_discapacidad").val() === "SI";
                }
            }
        },
        messages: {
            tipo_documento: { required: "Seleccione el tipo de documento" },
            sexo: { required: "Seleccione el sexo" },
            nombres: { required: "Ingrese los nombres", minlength: "Mínimo 2 caracteres" },
            apellido_paterno: { required: "Ingrese el apellido paterno", minlength: "Mínimo 2 caracteres" },
            apellido_materno: { required: "Ingrese el apellido materno", minlength: "Mínimo 2 caracteres" },
            fecha_nacimiento: { required: "Ingrese la fecha de nacimiento" },
            nacionalidad: { required: "Ingrese la nacionalidad", minlength: "Mínimo 3 caracteres" },
            etnia: { required: "Seleccione la etnia" },
            nacionalidad_indigena: { required: "Seleccione la nacionalidad indígena" },
            posee_discapacidad: { required: "Seleccione una opción" },
            sucursal: { required: "Seleccione la extensión" },
            provincia: { required: "Ingrese la provincia", minlength: "Mínimo 2 caracteres" },
            canton: { required: "Ingrese el cantón", minlength: "Mínimo 2 caracteres" },
            parroquia: { required: "Ingrese la parroquia", minlength: "Mínimo 2 caracteres" },
            direccion: { required: "Ingrese la dirección", minlength: "Mínimo 5 caracteres" },
            tipo_discapacidad: { required: "Seleccione el tipo de discapacidad" },
            porcentaje_discapacidad: {
                required: "Ingrese el porcentaje de discapacidad",
                digits: "Solo números enteros",
                min: "No puede ser menor a 0",
                max: "No puede ser mayor a 100"
            }
        },
        errorElement: "div",
        errorClass: "text-danger mt-1"
    });
});
</script>
{% endblock %}

{% endblock %}
